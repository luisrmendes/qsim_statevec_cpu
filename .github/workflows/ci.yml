name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  code_checks:
    name: Code Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Enforce formatting
        run: cargo fmt --check
      - name: Linting
        run: cargo clippy -- -D warnings
      - name: Run tests
        run: cargo test

  functional_tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: code_checks
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Set up functional test environment
        run: |
          python -m venv functional_tests/.venv
          functional_tests/.venv/bin/python -m pip install --upgrade pip
          functional_tests/.venv/bin/python -m pip install qiskit
      - name: Compare qsim_statevec_cpu output with Qiskit
        run: python ./functional_tests/run_functional_tests.py

  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: functional_tests
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@cargo-deny
      - name: Scan for vulnerabilities
        run: cargo deny check advisories
